<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Targeting System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            cursor: none;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Grid lines */
        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .vertical-line, .horizontal-line {
            position: absolute;
            background: rgba(147, 112, 219, 0.4);
            box-shadow: 0 0 10px rgba(147, 112, 219, 0.6);
        }

        .vertical-line {
            width: 2px;
            height: 100%;
            top: 0;
        }

        .horizontal-line {
            height: 2px;
            width: 100%;
            left: 0;
        }

        /* Diagonal lines */
        .diagonal {
            position: absolute;
            width: 2px;
            height: 400%;
            background: rgba(218, 165, 32, 0.5);
            box-shadow: 0 0 10px rgba(218, 165, 32, 0.6);
            top: 50%;
            left: 50%;
            transform-origin: center;
        }

        .diagonal:nth-child(1) { transform: translate(-50%, -50%) rotate(45deg); }
        .diagonal:nth-child(2) { transform: translate(-50%, -50%) rotate(-45deg); }
        .diagonal:nth-child(3) { transform: translate(-50%, -50%) rotate(22.5deg); }
        .diagonal:nth-child(4) { transform: translate(-50%, -50%) rotate(-22.5deg); }
        .diagonal:nth-child(5) { transform: translate(-50%, -50%) rotate(67.5deg); }
        .diagonal:nth-child(6) { transform: translate(-50%, -50%) rotate(-67.5deg); }

        /* Targeting reticle */
        .reticle {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .circle {
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 50%;
            border: 2px solid;
            transform: translate(-50%, -50%);
        }

        .circle-outer-large {
            width: 400px;
            height: 400px;
            border-color: rgba(218, 165, 32, 0.5);
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.3);
        }

        .circle-outer {
            width: 300px;
            height: 300px;
            border-color: rgba(218, 165, 32, 0.6);
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
        }

        .circle-middle {
            width: 200px;
            height: 200px;
            border-color: rgba(218, 165, 32, 0.7);
            box-shadow: 0 0 15px rgba(218, 165, 32, 0.5);
        }

        .circle-inner {
            width: 120px;
            height: 120px;
            border-color: rgba(50, 205, 50, 0.8);
            background: rgba(50, 205, 50, 0.1);
            box-shadow: 0 0 30px rgba(50, 205, 50, 0.6);
        }

        .circle-center {
            width: 40px;
            height: 40px;
            border-color: transparent;
            background: transparent;
            box-shadow: none;
        }

        .text {
            position: absolute;
            color: #32cd32;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #32cd32;
            transform: translate(-50%, -50%);
            top: -80px;
            left: 0;
            letter-spacing: 3px;
        }

        .cross-line {
            position: absolute;
            background: rgb(255 182 0);
            box-shadow: 0 0 10px rgba(218, 165, 32, 0.4);
        }

        .cross-horizontal-left,
        .cross-horizontal-right {
            width: 300px;
            height: 3px;
            top: 0;
        }

        .cross-horizontal-left {
            right: 20px;
        }

        .cross-horizontal-right {
            left: 20px;
        }

        .cross-vertical-top,
        .cross-vertical-bottom {
            width: 3px;
            height: 300px;
            left: 0;
        }

        .cross-vertical-top {
            bottom: 20px;
        }

        .cross-vertical-bottom {
            top: 20px;
        }

        .calibration {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            width: 0;
            height: 0;
        }

        .calibration-dashed-line {
            position: absolute;
            width: 2px;
            height: 250px;
            background: repeating-linear-gradient(to top, rgb(255 182 0 / 80%) 0px, rgba(218, 165, 32, 0.8) 48px, transparent 18px, transparent 85px);
            left: 0;
            top: 0;
            transform-origin: top center;
        }

        .calibration-dashed-line:nth-child(1) { transform: rotate(22.5deg); }
        .calibration-dashed-line:nth-child(2) { transform: rotate(67.5deg); }
        .calibration-dashed-line:nth-child(3) { transform: rotate(112.5deg); }
        .calibration-dashed-line:nth-child(4) { transform: rotate(157.5deg); }
        .calibration-dashed-line:nth-child(5) { transform: rotate(202.5deg); }
        .calibration-dashed-line:nth-child(6) { transform: rotate(247.5deg); }
        .calibration-dashed-line:nth-child(7) { transform: rotate(292.5deg); }
        .calibration-dashed-line:nth-child(8) { transform: rotate(337.5deg); }

        .tunnel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
        }

        .line {
            position: absolute;
            width: 3px;
            height: 100%;
            background: rgba(200, 180, 255, 0.9);
            box-shadow:
                    0 0 15px rgba(200, 180, 255, 0.8),
                    0 0 30px rgba(200, 180, 255, 0.6),
                    0 0 45px rgba(147, 112, 219, 0.4);
            top: 0;
        }

        .line-left-1 {
            left: 10%;
        }

        .line-left-2 {
            left: 22%;
        }

        .line-left-3 {
            left: 31%;
        }

        .line-left-4 {
            left: 37%;
        }

        .line-left-5 {
            left: 41%;
        }

        .line-right-1 {
            right: 41%;
        }

        .line-right-2 {
            right: 37%;
        }

        .line-right-3 {
            right: 31%;
        }

        .line-right-4 {
            right: 22%;
        }

        .line-right-5 {
            right: 10%;
        }
    </style>
</head>
<body>
<div class="container">

    <div class="tunnel">
        <div class="line line-left-1"></div>
        <div class="line line-left-2"></div>
        <div class="line line-left-3"></div>
        <div class="line line-left-4"></div>
        <div class="line line-left-5"></div>

        <div class="line line-right-1"></div>
        <div class="line line-right-2"></div>
        <div class="line line-right-3"></div>
        <div class="line line-right-4"></div>
        <div class="line line-right-5"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="diagonals">
        <div class="diagonal"></div>
        <div class="diagonal"></div>
        <div class="diagonal"></div>
        <div class="diagonal"></div>
        <div class="diagonal"></div>
        <div class="diagonal"></div>
    </div>

    <div class="reticle" id="reticle">
        <div class="circle circle-outer-large"></div>
        <div class="circle circle-outer"></div>
        <div class="circle circle-middle"></div>
        <div class="circle circle-inner"></div>
        <div class="circle circle-center"></div>
        <div class="text">CLOSING IN</div>
        <div class="cross-line cross-horizontal-left"></div>
        <div class="cross-line cross-horizontal-right"></div>
        <div class="cross-line cross-vertical-top"></div>
        <div class="cross-line cross-vertical-bottom"></div>
        <div class="calibration">
            <div class="calibration-dashed-line"></div>
            <div class="calibration-dashed-line"></div>
            <div class="calibration-dashed-line"></div>
            <div class="calibration-dashed-line"></div>
            <div class="calibration-dashed-line"></div>
            <div class="calibration-dashed-line"></div>
            <div class="calibration-dashed-line"></div>
            <div class="calibration-dashed-line"></div>
        </div>
    </div>
</div>

<script>
    // Create grid lines
    const grid = document.getElementById('grid');
    const numVertical = 12;
    const numHorizontal = 8;

    for (let i = 0; i < numVertical; i++) {
        const line = document.createElement('div');
        line.className = 'vertical-line';
        line.style.left = (i / (numVertical - 1)) * 100 + '%';
        grid.appendChild(line);
    }

    for (let i = 0; i < numHorizontal; i++) {
        const line = document.createElement('div');
        line.className = 'horizontal-line';
        line.style.top = (i / (numHorizontal - 1)) * 100 + '%';
        grid.appendChild(line);
    }

    // Mouse tracking
    const reticle = document.getElementById('reticle');
    const text = document.querySelector('.text');

    document.addEventListener('mousemove', (e) => {
        reticle.style.left = e.clientX + 'px';
        reticle.style.top = e.clientY + 'px';

        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const distance = Math.sqrt(
            Math.pow(e.clientX - centerX, 2) +
            Math.pow(e.clientY - centerY, 2)
        );

        if (distance < 20) {
            text.textContent = 'LOCKED IN';
            text.style.color = '#ff0000';
            text.style.textShadow = '0 0 20px #ff0000';
        } else {
            text.textContent = 'CLOSING IN';
            text.style.color = '#32cd32';
            text.style.textShadow = '0 0 10px #32cd32';
        }
    });

    // Center reticle initially
    reticle.style.left = window.innerWidth / 2 + 'px';
    reticle.style.top = window.innerHeight / 2 + 'px';
</script>
</body>
</html>
