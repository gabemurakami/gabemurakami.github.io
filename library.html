<!DOCTYPE html>
<html lang="en">
<head>
    <title>Library</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/css/library.css">
</head>
<body>
<div class="container">

    <div class="monitor">

        <a class="nav-row" href="/">
            <div class="channel">
                <div class="label cardiovascular">Home</div>
                <div class="waveform">
                    <canvas id="cardio"></canvas>
                    <div class="cardiac-marker"></div>
                </div>
            </div>
        </a>

        <a class="nav-row" href="/calibration.html">
            <div class="channel">
                <div class="label metabolic">Calibration</div>
                <div class="waveform">
                    <canvas id="metabolic"></canvas>
                </div>
            </div>
        </a>

        <a class="nav-row">
            <div class="channel">
                <div class="label nervous">Central<br>Nerv System</div>
                <div class="waveform">
                    <canvas id="nervous"></canvas>
                </div>
            </div>
        </a>

        <a class="nav-row">
            <div class="channel">
                <div class="label pulmonary">Pulmonary<br>Function</div>
                <div class="waveform">
                    <canvas id="pulmonary"></canvas>
                </div>
            </div>
        </a>

        <a class="nav-row">
            <div class="channel">
                <div class="label systems">Systems<br>Integration</div>
                <div class="waveform">
                    <canvas id="systems"></canvas>
                </div>
            </div>
        </a>

        <a class="nav-row">
            <div class="channel">
                <div class="label locomotor">Locomotor<br>System</div>
                <div class="waveform">
                    <canvas id="locomotor"></canvas>
                </div>
            </div>
        </a>

    </div>

</div>

<script>
    class WaveformGenerator {
        constructor(canvasId, waveType) {
            this.canvas = document.getElementById(canvasId);
            this.ctx = this.canvas.getContext('2d');
            this.waveType = waveType;
            this.offset = 0;
            this.resize();
            window.addEventListener('resize', () => this.resize());
            this.animate();
        }

        resize() {
            this.canvas.width = this.canvas.offsetWidth;
            this.canvas.height = this.canvas.offsetHeight;
        }

        drawECG(x, y, amplitude) {

            // P wave
            this.ctx.lineTo(x + 10, y - amplitude * 0.2);
            this.ctx.lineTo(x + 20, y);

            // Q wave
            this.ctx.lineTo(x + 25, y + amplitude * 0.1);

            // R wave (spike)
            this.ctx.lineTo(x + 30, y - amplitude * 0.9);

            // S wave
            this.ctx.lineTo(x + 35, y + amplitude * 0.15);

            // ST segment
            this.ctx.lineTo(x + 50, y);

            // T wave
            this.ctx.lineTo(x + 60, y - amplitude * 0.25);
            this.ctx.lineTo(x + 70, y);

        }

        drawWave() {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            this.ctx.strokeStyle = '#00ff88';
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();

            const centerY = this.canvas.height / 2;
            const amplitude = this.canvas.height * 0.35;

            this.ctx.moveTo(0, centerY);

            switch(this.waveType) {
                case 'ecg':
                    const beatWidth = 80;
                    for (let x = Math.floor(-this.offset / beatWidth) * beatWidth - beatWidth * 2;
                         x < this.canvas.width + beatWidth;
                         x += beatWidth) {
                        const adjustedX = x + this.offset;
                        this.drawECG(adjustedX, centerY, amplitude);
                    }
                    break;

                case 'metabolic':
                    for (let x = 0; x < this.canvas.width; x++) {
                        const adjustedX = x + this.offset;
                        const y = centerY + Math.sin((adjustedX) * 0.08) * amplitude * 0.6 +
                            Math.sin((adjustedX) * 0.03) * amplitude * 0.3;
                        this.ctx.lineTo(x, y);
                    }
                    break;

                case 'nervous':
                    for (let x = 0; x < this.canvas.width; x++) {
                        const adjustedX = x + this.offset;
                        const noise = Math.sin(adjustedX * 0.5) * Math.cos(adjustedX * 0.7);
                        const y = centerY + noise * amplitude * 0.15;
                        this.ctx.lineTo(x, y);
                    }
                    break;

                case 'respiratory':
                    for (let x = 0; x < this.canvas.width; x++) {
                        const adjustedX = x + this.offset;
                        const y = centerY + Math.sin((adjustedX) * 0.04) * amplitude * 0.7;
                        this.ctx.lineTo(x, y);
                    }
                    break;

                case 'square':
                    for (let x = 0; x < this.canvas.width; x++) {
                        const adjustedX = x + this.offset;
                        const cycle = Math.floor((adjustedX) / 100) % 3;
                        let y;
                        if (cycle === 0) {
                            y = centerY - amplitude * 0.5;
                        } else if (cycle === 1) {
                            y = centerY;
                        } else {
                            y = centerY - amplitude * 0.3;
                        }
                        this.ctx.lineTo(x, y);
                    }
                    break;

                case 'erratic':
                    for (let x = 0; x < this.canvas.width; x += 3) {
                        const adjustedX = x + this.offset;
                        const y = centerY + (Math.sin(adjustedX * 0.1) * amplitude * 0.4) +
                            (Math.random() - 0.5) * amplitude * 0.5;
                        this.ctx.lineTo(x, y);
                    }
                    break;
            }

            this.ctx.stroke();
        }

        animate() {
            this.offset -= 0.5;
            if (this.waveType === 'ecg' && this.offset < -80) {
                this.offset = 0;
            } else if (this.offset < -1000) {
                this.offset = 0;
            }
            this.drawWave();
            requestAnimationFrame(() => this.animate());
        }
    }

    new WaveformGenerator('cardio', 'ecg');
    new WaveformGenerator('metabolic', 'metabolic');
    new WaveformGenerator('nervous', 'nervous');
    new WaveformGenerator('pulmonary', 'respiratory');
    new WaveformGenerator('systems', 'square');
    new WaveformGenerator('locomotor', 'erratic');
</script>
</body>
</html>
